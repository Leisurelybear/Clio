name: Release desktop build

# Build the Clio desktop shell (PyInstaller onedir) on Windows and publish
# a GitHub Release with the packaged folder as a zip asset.
#
# Triggers:
#   - push a semver tag:  git tag v0.1.0 && git push origin v0.1.0
#   - manual run:         Actions -> "Release desktop build" -> Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Defaults to the git tag."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build onedir (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-locked.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-locked.txt
          pip install pyinstaller pywebview pythonnet

      - name: Build onedir
        run: python -m PyInstaller packaging/clio.spec --noconfirm --clean

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/clio/clio.exe")) { throw "clio.exe not built" }
          if (-not (Test-Path "dist/clio/_internal/clio/ui/static/index.html")) { throw "static assets missing" }
          Write-Output "onedir OK"

      - name: Copy desktop README next to exe
        shell: pwsh
        run: |
          Copy-Item "packaging/README-desktop.md" (Join-Path "dist/clio" "README-desktop.md") -Force
          if (-not (Test-Path "dist/clio/README-desktop.md")) { throw "README-desktop.md missing in bundle" }

      - name: Smoke test server startup
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "clio-smoke"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Copy-Item "config.example.yaml" (Join-Path $work "config.yaml") -Force
          $p = Start-Process -FilePath "$PWD/dist/clio/clio.exe" -WorkingDirectory $work -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            $conn = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -eq $p.Id } | Select-Object -First 1
            if ($conn) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$($conn.LocalPort)/" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            Start-Sleep -Milliseconds 500
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "desktop server did not serve index" }
          Write-Output "smoke OK"

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            if ("${{ github.event_name }}" -eq "push") { $ver = "${{ github.ref_name }}".TrimStart('v') }
            else { $ver = "0.0.0-dev" }
          }
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package onedir as zip
        shell: pwsh
        run: |
          $name = "clio-${{ steps.version.outputs.version }}-windows-x64"
          Compress-Archive -Path "dist/clio" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Write-Output "artifact=$name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clio-${{ steps.version.outputs.version }}-windows-x64
          path: clio-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" `
            "clio-${{ steps.version.outputs.version }}-windows-x64.zip" `
            --title "Clio $tag" `
            --notes "Desktop build for Windows (PyInstaller onedir). See packaging/README-desktop.md for WebView2 / ffmpeg / SmartScreen notes." `
            --repo "${{ github.repository }}"
